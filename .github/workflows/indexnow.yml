name: indexnow

# After every push to main (which auto-deploys via the git-connected Cloudflare
# integration), submit all sitemap URLs to IndexNow so Bing/Yandex/Seznam/Naver
# re-crawl promptly. Google doesn't participate in IndexNow; it re-reads
# sitemap.xml on its own schedule. See docs/seo-plan.md §1.3.
#
# The 90s wait lets the Cloudflare deploy finish first, so engines that crawl
# immediately see the new content (and the IndexNow key file stays fetchable
# at the live domain, which is how the protocol verifies ownership).

on:
  push:
    branches: [main]

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Wait for Cloudflare deploy to settle
        run: sleep 90
      - name: Submit sitemap URLs to IndexNow
        run: node scripts/submit-indexnow.mjs
