name: deploy

# Diffhero has no Cloudflare-dashboard git integration (connecting one needs an
# interactive GitHub OAuth step that can't be scripted) — every deploy so far
# has been a manual local `wrangler deploy`. This workflow IS the auto-deploy:
# every push to main uploads the current static site to the Cloudflare Worker
# directly via wrangler, authenticated with repo secrets
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID.
#
# The site ships pre-built static HTML (no build step at deploy time) — this
# just uploads exactly what's committed, same as a local `wrangler deploy`.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
