<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Social share card (1200x630). Re-rasterize to og-image.png after edits with headless Chromium. -->
  <rect width="1200" height="630" fill="oklch(0.14 0.012 235)"/>
  <rect x="60" y="60" width="1080" height="510" rx="14" fill="oklch(0.185 0.013 235)" stroke="oklch(0.29 0.015 235)" stroke-width="2"/>

  <!-- brand mark: two diff bars -->
  <rect x="100" y="112" width="26" height="60" rx="4" fill="oklch(0.70 0.18 25)"/>
  <rect x="140" y="112" width="26" height="60" rx="4" fill="oklch(0.72 0.15 152)"/>

  <text x="196" y="162" font-family="IBM Plex Sans, sans-serif" font-size="72" font-weight="700" fill="oklch(0.94 0.004 235)" letter-spacing="-2">Diffhero</text>
  <text x="100" y="250" font-family="IBM Plex Sans, sans-serif" font-size="40" font-weight="600" fill="oklch(0.94 0.004 235)">See exactly what changed.</text>
  <text x="100" y="300" font-family="IBM Plex Sans, sans-serif" font-size="27" font-weight="400" fill="oklch(0.62 0.012 235)">A free online diff checker for text &amp; code — with word-level highlighting.</text>

  <!-- mini split-diff illustration -->
  <g font-family="IBM Plex Mono, monospace" font-size="26">
    <rect x="100" y="345" width="480" height="150" rx="6" fill="oklch(0.66 0.17 25 / 0.13)" stroke="oklch(0.70 0.18 25 / 0.4)"/>
    <text x="120" y="382" fill="oklch(0.62 0.012 235)">1</text><text x="160" y="382" fill="oklch(0.94 0.004 235)">const rate = <tspan fill="oklch(0.70 0.18 25)" font-weight="700">1</tspan>;</text>
    <text x="120" y="422" fill="oklch(0.62 0.012 235)">2</text><text x="160" y="422" fill="oklch(0.94 0.004 235)">free = true;</text>
    <text x="120" y="462" fill="oklch(0.62 0.012 235)">3</text><text x="160" y="462" fill="oklch(0.94 0.004 235)">limit();</text>

    <rect x="620" y="345" width="480" height="150" rx="6" fill="oklch(0.72 0.15 152 / 0.13)" stroke="oklch(0.72 0.15 152 / 0.45)"/>
    <text x="640" y="382" fill="oklch(0.62 0.012 235)">1</text><text x="680" y="382" fill="oklch(0.94 0.004 235)">const rate = <tspan fill="oklch(0.72 0.15 152)" font-weight="700">0</tspan>;</text>
    <text x="640" y="422" fill="oklch(0.62 0.012 235)">2</text><text x="680" y="422" fill="oklch(0.94 0.004 235)">free = true;</text>
    <text x="640" y="462" fill="oklch(0.72 0.15 152)" font-weight="700">+</text><text x="680" y="462" fill="oklch(0.94 0.004 235)">share();</text>
  </g>

  <text x="100" y="548" font-family="IBM Plex Mono, monospace" font-size="23" font-weight="500" fill="oklch(0.72 0.16 198)">free · no signup · nothing uploaded · runs in your browser</text>
</svg>
